<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <!-- df-decode — Marca "DF" (fondo transparente) -->
  <defs>
    <linearGradient id="dfNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f3a6b"/>
      <stop offset="100%" stop-color="#152a52"/>
    </linearGradient>
    <linearGradient id="dfCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2ec4e6"/>
      <stop offset="100%" stop-color="#1596c9"/>
    </linearGradient>
    <linearGradient id="dfSwoosh" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1b3570"/>
      <stop offset="45%" stop-color="#2557c7"/>
      <stop offset="100%" stop-color="#3b8cf0"/>
    </linearGradient>
    <linearGradient id="dfStem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2557c7"/>
      <stop offset="100%" stop-color="#1b3570"/>
    </linearGradient>
    <linearGradient id="dfSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7b8494"/>
      <stop offset="45%" stop-color="#d9dde3"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>
  </defs>

  <!-- ===== D ===== -->
  <!-- Asta superior -->
  <rect x="20" y="12" width="42" height="46" fill="url(#dfNavy)"/>
  <!-- Cuña cian -->
  <polygon points="20,64 62,64 20,106" fill="url(#dfCyan)"/>
  <!-- Asta inferior con corte diagonal -->
  <polygon points="62,70 62,188 20,188 20,112" fill="url(#dfNavy)"/>
  <!-- Panza de la D -->
  <path fill="url(#dfNavy)" fill-rule="evenodd"
        d="M62 12 H95 C145 12 170 50 170 100 C170 150 145 188 95 188 H62 V148 H92 C118 148 132 125 132 100 C132 75 118 52 92 52 H62 Z"/>

  <!-- ===== F ===== -->
  <!-- Asta vertical de la F -->
  <polygon points="184,92 218,80 218,188 184,188" fill="url(#dfStem)"/>
  <!-- Barra media gris metálica -->
  <polygon points="218,80 288,80 276,112 218,112" fill="url(#dfSteel)"/>
  <!-- Cinta azul: nace dentro de la D y forma la barra superior de la F -->
  <path fill="url(#dfSwoosh)"
        d="M88 150 C140 152 158 112 168 72 C177 36 196 12 232 12 H292 L280 48 H234 C216 48 207 62 202 82 C190 128 148 162 88 150 Z"/>
</svg>
